<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Tạo khóa học - ConteGiacJP</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.container{
    width:900px;
    margin:40px auto;
    background:white;
    border-radius:12px;
    padding:50px;
    box-shadow:0 0 15px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#1E40AF;
    margin-bottom:50px;
}

.form-row{
    display:flex;
    margin-bottom:28px;
    align-items:flex-start;
}

.form-row label{
    width:170px;
    font-size:24px;
    font-weight:bold;
    padding-top:12px;
}

.right{
    flex:1;
}

input,
select,
textarea{

    width:100%;
    padding:14px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;

}

textarea{

    height:180px;
    resize:vertical;

}

.note{

    color:#777;
    margin-top:10px;
    font-size:17px;

}

.create{

    text-align:center;
    margin-top:40px;

}

button{

    background:#57B9F4;
    color:white;
    border:none;
    padding:16px 50px;
    font-size:22px;
    border-radius:8px;
    cursor:pointer;

}

button:hover{

    background:#3da8e8;

}

.back{

    width:900px;
    margin:25px auto 0;
    text-align:right;

}

.back a{

    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="back">
<a href="n1.html">⬅ Quay lại</a>
</div>

<div class="container">

<h1>Tạo khóa học</h1>

<div class="form-row">

<label>Tên</label>

<div class="right">

<input type="text">

<div class="note">
Đặt tên phù hợp để học viên dễ tìm kiếm khóa học.
</div>

</div>

</div>

<div class="form-row">

<label>Level</label>

<div class="right">

<select>

<option>N1</option>

<option>N2</option>

<option>N3</option>

<option>N4</option>

<option>N5</option>

<option>Kanji</option>

</select>

</div>

</div>

<div class="form-row">

<label>Dạng</label>

<div class="right">

<select>

<option>Từ vựng</option>

<option>Kanji</option>

<option>Ngữ pháp</option>

<option>Đọc hiểu</option>

<option>Nghe</option>

<option>Đề thi</option>

<option>Khác</option>

</select>

</div>

</div>

<div class="form-row">

<label>Mô tả</label>

<div class="right">

<textarea></textarea>

<div class="note">
Mô tả ngắn về nội dung khóa học.
</div>

</div>

</div>

<div class="create">

<button>

📘 Tạo khóa học

</button>

</div>

</div>

</body>

</html>
