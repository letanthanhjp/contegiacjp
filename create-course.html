<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Tạo khóa học - ConteGiacJP</title>

<style>

body{
    margin:0;
    background:#F3F6FB;
    font-family:Arial,sans-serif;
}

.top-bar{
    display:flex;
    justify-content:flex-end;
    padding:20px 40px;
}

.top-bar a{
    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:12px 22px;
    border-radius:12px;
    font-weight:bold;
    transition:.25s;
    box-shadow:0 5px 15px rgba(34,197,94,.35);
}

.top-bar a:hover{
    background:#16a34a;
}

.container{
    width:900px;
    margin:20px auto 60px;
    background:white;
    border-radius:20px;
    padding:50px;
    box-shadow:0 0 25px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#1E40AF;
    margin-bottom:40px;
}

.form-group{
    margin-bottom:25px;
}

label{
    display:block;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

input,
select,
textarea{

    width:100%;
    padding:14px;
    font-size:17px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;

}

textarea{
    resize:vertical;
    min-height:120px;
}

.btn{
    width:100%;
    background:#22c55e;
    color:white;
    border:none;
    padding:16px;
    font-size:22px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
}

.btn:hover{
    background:#16a34a;
}

</style>

</head>

<body>

<div class="top-bar">
    <a href="n1.html">⬅ Quay lại</a>
</div>

<div class="container">

<h1>📘 Tạo khóa học</h1>

<div class="form-group">

<label>Tên khóa học</label>

<input type="text"
placeholder="Ví dụ: Shin Kanzen Master Goi N1">

</div>

<div class="form-group">

<label>Level</label>

<select>

<option>N1</option>

<option>N2</option>

<option>N3</option>

<option>N4</option>

<option>N5</option>

<option>Kanji</option>

</select>

</div>

<div class="form-group">

<label>Dạng</label>

<select>

<option>Từ vựng</option>

<option>Kanji</option>

<option>Ngữ pháp</option>

<option>Đọc hiểu</option>

<option>Nghe</option>

<option>Đề thi</option>

<option>Khác</option>

</select>

</div>

<div class="form-group">

<label>Tên bộ sách</label>

<input
type="text"
placeholder="Ví dụ: Shin Kanzen Master">

</div>

<div class="form-group">

<label>Số bài</label>

<input
type="number"
placeholder="Ví dụ: 50">

</div>

<div class="form-group">

<label>Mô tả</label>

<textarea
placeholder="Giới thiệu ngắn về khóa học..."></textarea>

</div>

<button class="btn">

📘 Tạo khóa học

</button>

</div>

</body>

</html>
