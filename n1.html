<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>N1 - ConteGiacJP</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>

body{
    margin:0;
    background:#F3F6FB;
    font-family:Arial,sans-serif;
}

/* ================= HEADER ================= */

.header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 50px;

    background:white;

    border-bottom:3px solid #22c55e;

}

.logo{

    display:flex;
    align-items:center;

    gap:18px;

}

.logo img{

    width:135px;
    height:auto;

}

.logo-text h1{

    margin:0;

    color:#16a34a;

    font-size:42px;

}

.logo-text p{

    margin:6px 0 0;

    color:#666;

    font-size:22px;

}


.home-btn{

    text-decoration:none;

    color:white;

    background:linear-gradient(135deg,#22c55e,#16a34a);

    padding:18px 30px;

    border-radius:12px;

    font-size:20px;

    font-weight:bold;

    box-shadow:0 6px 16px rgba(34,197,94,.35);

    transition:.25s;

}

.home-btn:hover{

    transform:translateY(-2px);

}

/* ================= KHUNG ================= */

.container{

    width:1100px;
    max-width:90%;

    margin:50px auto;

    background:white;

    border-radius:20px;

    padding:50px;

    box-shadow:0 0 25px rgba(0,0,0,.12);

    text-align:center;

}


/* ================= NÚT ================= */

.create-btn{

    display:inline-block;

    text-decoration:none;

    background:linear-gradient(135deg,#22c55e,#16a34a);

    color:white;

    padding:15px 30px;

    border-radius:12px;

    font-size:20px;

    font-weight:bold;

    transition:.25s;

    box-shadow:0 5px 15px rgba(34,197,94,.35);

}

.create-btn:hover{

    transform:translateY(-2px);

}

    /*================ LEVEL TOP =================*/

.level-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    margin-bottom:35px;

    gap:30px;

}

.course-count{

    background:white;

    border-radius:14px;

    padding:18px 25px;

    margin-bottom:25px;

    font-size:24px;

    font-weight:bold;

    text-align:left;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.course-count span{

    color:#16a34a;

    font-size:30px;

}
    
/* ================= DANH SÁCH ================= */

.course-list{

    margin-top:0;

    border:2px dashed #d8e8d8;

    border-radius:18px;

    padding:100px 20px;

    background:#FCFFFC;

}

.empty{

    color:#555;

    font-size:30px;

    margin:0;

}

.empty2{

    color:#888;

    font-size:20px;

    margin-top:20px;

}

    /*================ LEVEL =================*/

.level-header{

    display:flex;
    align-items:center;
    gap:30px;

    margin-bottom:0;

}

.level-icon{

    width:100px;
    height:100px;

    border-radius:20px;

    background:linear-gradient(135deg,#22c55e,#16a34a);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;
    font-weight:bold;

    box-shadow:0 10px 25px rgba(34,197,94,.35);

}

.page-title{

    margin:0;

    color:#111827;

    font-size:44px;

}

.page-desc{

    margin-top:10px;

    color:#6b7280;

    font-size:22px;

    line-height:1.6;

}
    
</style>

</head>

<body>

<div class="header">

    <div class="logo">

        <img src="logo.png" alt="ConteGiacJP">

        <div class="logo-text">

            <h1>ConteGiacJP</h1>

            <p>Học tiếng Nhật bằng cách kiên trì lặp đi lặp lại mỗi ngày!</p>

        </div>

    </div>

    <a href="index.html" class="home-btn">
        🏠 Về trang chủ
    </a>

</div>

<div class="container">

<div class="level-top">

    <div class="level-header">

    <div class="level-icon">
        N1
    </div>

    <div>

        <h2 class="page-title">
            Trình độ N1
        </h2>

        <p class="page-desc">
            Khóa học dành cho người học ở trình độ JLPT N1.
            Hãy chọn khóa học phù hợp để bắt đầu.
        </p>

    </div>

 </div>

    <a href="create-course.html" class="create-btn">
        ➕ Tạo khóa học
    </a>

</div>

<div class="course-count">

    📚 Hiện có:
    <span>0</span> khóa học

</div>


<div class="course-list">

    <p class="empty">
        📚 Chưa có khóa học nào.
    </p>

    <p class="empty2">
        Nhấn "Tạo khóa học" để bắt đầu.
    </p>

</div>

</div>

</body>

</html>
