<!DOCTYPE html>
<html lang="vi">

<head>

<title>N1 - ConteGiacJP</title>

<style>

body{
    margin:0;
    background:#F3F6FB;
    font-family:Arial, sans-serif;
}

/* Thanh trên cùng */

.top-bar{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:20px 40px;
}

.top-bar a{
    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:12px 22px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:0.25s;
    box-shadow:0 5px 15px rgba(34,197,94,.35);
}

.top-bar a:hover{
    background:#16a34a;
    transform:translateY(-2px);
}

/* Nội dung */

.container{
    width:900px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    padding:60px;
    box-shadow:0 0 25px rgba(0,0,0,.12);
    text-align:center;
}

h1{
    color:#1E40AF;
    font-size:52px;
    margin-bottom:20px;
}

p{
    font-size:24px;
    line-height:42px;
    color:#333;
}

</style>

</head>

<body>

<div class="top-bar">
    <a href="index.html">🏠 Trang chủ</a>
