<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>N1 - ConteGiacJP</title>

<style>

body{
    margin:0;
    background:#F3F6FB;
    font-family:Arial, sans-serif;
}

/* Thanh trên */

.top-bar{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:20px 40px;
}

.top-bar a{
    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:12px 22px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:.25s;
    box-shadow:0 5px 15px rgba(34,197,94,.35);
}

.top-bar a:hover{
    background:#16a34a;
    transform:translateY(-2px);
}

/* Khung */

.container{
    width:900px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    padding:60px;
    box-shadow:0 0 25px rgba(0,0,0,.12);
    text-align:center;
}

h1{
    color:#1E40AF;
    font-size:52px;
    margin-bottom:35px;
}

/* Nút tạo khóa học */

.create-btn{
    display:inline-block;
    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:15px 30px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    transition:.25s;
    box-shadow:0 5px 15px rgba(34,197,94,.35);
}

.create-btn:hover{
    background:#16a34a;
    transform:translateY(-2px);
}

/* Danh sách khóa học */

.course-list{
    margin-top:45px;
}

.empty{
    color:#888;
    font-size:22px;
    margin-top:50px;
}

</style>

</head>

<body>

<div class="top-bar">
    <a href="index.html">🏠 Trang chủ</a>
</div>

<div class="container">

<h1>N1</h1>

<a href="create-course.html" class="create-btn">
➕ Tạo khóa học
</a>

<div class="course-list">

    <p class="empty">
        Chưa có khóa học nào.
    </p>

</div>

</div>

</body>

</html>
