<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Hồ sơ - ConteGiacJP</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>

body{
    margin:0;
    background:#F3F6FB;
    font-family:Arial;
    color:#333;
}


/* ================= HEADER ================= */

.header{
    width:1000px;
    margin:30px auto 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-title{
    color:#1E40AF;
    font-size:28px;
    font-weight:bold;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-btn{
    display:flex;
    align-items:center;
    gap:7px;
    color:#1E40AF;
    font-size:15px;
    font-weight:bold;
    padding:8px 5px;
    white-space:nowrap;
}


.profile-btn{
    background:#22C55E;
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.profile-btn:hover{
    background:#16A34A;
}


.logout-btn{
    background:#EF4444;
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.logout-btn:hover{
    background:#DC2626;
}

.back-btn{
    background:white;
    color:#1E40AF;
    border:2px solid #1E40AF;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.back-btn:hover{
    background:#1E40AF;
    color:white;
}


/* ================= PROFILE ================= */

/* ================= PROFILE BOX ================= */

.profile-box{

    width:1000px;
    max-width:90%;

    margin:35px auto;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 0 25px rgba(0,0,0,.12);

    box-sizing:border-box;

}


/* ================= TIÊU ĐỀ ================= */


/* ================= PROFILE BOX ================= */
.profile-box h1{

    text-align:center;

    color:#D97706;

    margin:0 0 35px;

    font-size:32px;

}


/* ================= BỐ CỤC 2 CỘT ================= */

.profile-content{

    display:grid;

    grid-template-columns:300px 1fr;

    gap:50px;

    align-items:start;

}


/* ================= CỘT TRÁI ================= */

.profile-left{

    text-align:center;

    padding:10px;

}


.profile-left .avatar{

    width:180px;
    height:180px;

    margin:0 auto 20px;

    border-radius:50%;

    object-fit:cover;

    background:#EAFBF1;

    border:5px solid #EAFBF1;

    display:block;

}


.profile-left .userid{

    text-align:center;

    font-size:24px;

    font-weight:bold;

    color:#1E40AF;

    margin:20px 0 0;

}


/* ================= CỘT PHẢI ================= */

.profile-right{

    width:100%;

}


.profile-right .form-group{

    margin-bottom:22px;

}


/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .profile-box{

        width:90%;

        padding:25px;

    }

    .profile-content{

        grid-template-columns:1fr;

        gap:25px;

    }

    .profile-left{

        padding:0;

    }

    .profile-left .avatar{

        width:150px;
        height:150px;

    }

}

.profile-box h1{
    text-align:center;
    color:#D97706;
    margin-top:0;
    margin-bottom:35px;
}

.avatar{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#EAFBF1;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
}

.userid{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#1E40AF;
    margin-bottom:35px;
}


/* ================= FORM ================= */

.form-group{
    margin-bottom:25px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    font-size:16px;
}

.form-group input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #D5D5D5;
    border-radius:10px;
    font-size:16px;
}

.form-group input:focus{
    outline:none;
    border-color:#1E40AF;
}


/* ID không sửa được */

.readonly{
    background:#F3F4F6;
    color:#777;
    cursor:not-allowed;
}


/* ================= BUTTON ================= */

.save-btn{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#22C55E;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:hover{
    background:#16A34A;
}


.password-btn{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:2px solid #1E40AF;
    border-radius:10px;
    background:white;
    color:#1E40AF;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.password-btn:hover{
    background:#1E40AF;
    color:white;
}


/* ================= MESSAGE ================= */

.message{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#DCFCE7;
    color:#166534;
}

.error{
    background:#FEE2E2;
    color:#991B1B;
}

.message{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:999999;

    min-width:320px;

    max-width:80%;

    padding:18px 25px;

    border-radius:14px;

    text-align:center;

    font-size:16px;

    font-weight:bold;

    box-shadow:0 10px 35px rgba(0,0,0,.2);

}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .header{
        width:90%;
    }

    .profile-box{
        width:80%;
    }

}

.avatar-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:20px;
}



.avatar-edit{
    margin-top:10px;
    color:#1E40AF;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.avatar-edit:hover{
    text-decoration:underline;
}

.password-btn{
    width:100%;
    padding:14px;
    border:2px solid #1E40AF;
    border-radius:10px;
    background:white;
    color:#1E40AF;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.password-btn:hover{
    background:#1E40AF;
    color:white;
}


/* ================= LOGOUT POPUP ================= */

.logout-popup{
    display:none;
    position:fixed;
    z-index:9999;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    justify-content:center;

}

.logout-box{

}

.logout-icon{
    width:65px;
    height:65px;

    border-radius:50%;

    font-weight:bold;
}

.logout-box h2{

.logout-box p{

.logout-actions{

}

.logout-cancel,

.logout-cancel{

    border:2px solid #1E40AF;
}

.logout-cancel:hover{
    background:#EFF6FF;
}

.logout-confirm{
    background:#EF4444;
    color:white;

}

.logout-confirm:hover{

}

.label-note{

}


.password-box{

}


.password-box h2{

}


.password-group{

}


.password-group label{

    display:block;

    font-weight:bold;

    font-size:16px;

    color:#333;

}


.password-input{

    display:flex;

    align-items:center;

}


.password-input input{

    flex:1;

    width:100%;

}


.password-input input:focus{

}


.password-input button{

    border-radius:10px;

}

}


.password-error{

    display:none;

    margin-top:5px;

    margin-bottom:15px;

    padding:12px;

    border-radius:10px;

    background:#FEE2E2;

    color:#991B1B;

    font-size:14px;

    font-weight:bold;

}


.password-actions{

    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:25px;

}


.password-cancel,
.password-confirm{

    padding:13px 28px;

    font-weight:bold;

}

/* ================= PASSWORD CONFIRM POPUP ================= */

.password-confirm-popup{

    display:none;

    position:fixed;

    z-index:100000;

    top:0;
    left:0;

    width:100%;

    background:rgba(0,0,0,.45);

    justify-content:center;

}


.password-confirm-box{

    width:420px;

    padding:35px;

}


.password-confirm-icon{

    width:65px;

    margin:0 auto 15px;

    border-radius:50%;

    align-items:center;

}


.password-confirm-box h2{

}


.password-confirm-cancel,
.password-confirm-ok{

}


.password-confirm-cancel{

}

}


.password-confirm-ok{

}


.password-confirm-ok:hover{

}


.password-cancel{

}


.password-cancel:hover{

    background:#EFF6FF;

}


.password-confirm{

    background:#22C55E;

}


.password-confirm:hover{

    background:#16A34A;

}


@media(max-width:600px){

    .password-box{

        width:85%;

        padding:25px;

    }

}

</style>

<body>



<!-- ================= HEADER ================= -->

<div id="site-header"></div>


<!-- ================= PROFILE ================= -->

<!-- ================= PROFILE ================= -->

<div class="profile-box">

    <h1>HỒ SƠ CỦA TÔI</h1>


    <div class="profile-content">


        <!-- ================= CỘT TRÁI ================= -->

        <div class="profile-left">


            <div class="avatar-wrapper">

                <img
                    id="avatar-image"
                    class="avatar"
                    src=""
                    alt="Ảnh đại diện"
                >


                <div
                    class="avatar-edit"
                    onclick="document.getElementById('avatar-file').click()"
                >
                    ✏️ Sửa ảnh đại diện
                </div>


                <input
                    type="file"
                    id="avatar-file"
                    accept="image/*"
                    style="display:none"
                    onchange="changeAvatar(event)"
                >

            </div>


            <div
                class="userid"
                id="display-username"
            >
                Đang tải...
            </div>


        </div>


        <!-- ================= CỘT PHẢI ================= -->

        <div class="profile-right">


            <!-- ID ĐĂNG NHẬP -->

            <div class="form-group">

                <label>
                    ID đăng nhập
                </label>

                <input
                    type="text"
                    id="username"
                    class="readonly"
                    readonly
                >

            </div>


            <!-- MẬT KHẨU -->

            <div class="form-group">

                <label>
                    🔐 Mật khẩu
                </label>

                <button
                    class="password-btn"
                    onclick="changePassword()"
                >
                    🔐 Đổi mật khẩu
                </button>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>

                    Email

                    <span class="label-note">

                <input
                    type="email"

                    Số điện thoại

            <div
                id="message"

    </div>

</div>

<!-- ================= CHANGE PASSWORD POPUP ================= -->

<div id="password-popup" class="password-popup">

    <div class="password-box">

        <h2>🔐 ĐỔI MẬT KHẨU</h2>


        <!-- MẬT KHẨU CŨ -->

        <div class="password-group">

            <label>Mật khẩu hiện tại</label>

            <div class="password-input">

                <input
                    type="password"

                <button
                    type="button"

                    👁
                </button>

            </div>

        </div>


        <!-- MẬT KHẨU MỚI -->

        <div class="password-group">

            <label>Mật khẩu mới</label>

            <div class="password-input">

                <input
                    type="password"
                    id="new-password"
                    placeholder="Nhập mật khẩu mới"
                >

                <button
                    type="button"
                    onclick="togglePassword('new-password')"
                >
                    👁
                </button>

            </div>

        </div>


        <!-- XÁC NHẬN -->

        <div class="password-group">

            <label>Xác nhận mật khẩu mới</label>

            <div class="password-input">

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Nhập lại mật khẩu mới"

                <button
                    type="button"
                    onclick="togglePassword('confirm-password')"

                    👁
                </button>

            </div>

        </div>


        <div

        ></div>


        <div class="password-actions">

            <button
                class="password-cancel"

                Hủy

            <button

                Đổi mật khẩu

    </div>

</div>

<!-- ================= CONFIRM PASSWORD POPUP ================= -->

<div id="password-confirm-popup" class="password-confirm-popup">

    <div class="password-confirm-box">

        <div class="password-confirm-icon">
            🔐
        </div>

        <h2>
            Xác nhận đổi mật khẩu

        <p>
            Bạn có chắc chắn muốn đổi mật khẩu không?

        </div>

    </div>

</div>

<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://tnqvuclzzyxnzfszajjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_i9uqZBOYC2rhsdIimNGmeQ_oPXOrTnq";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ================= LOAD PROFILE ================= */

async function loadProfile(){

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if(!user){

        location.href = "index.html";

        return;

    }


    const username =
        user.user_metadata?.username || "";


    document.getElementById("display-username").textContent =
        username;

    document.getElementById("username").value =
        username;


    document.getElementById("email").value =
    user.user_metadata?.profile_email || "";

     document.getElementById("phone").value =
    user.user_metadata?.profile_phone || "";

    const avatarImage =
    document.getElementById("avatar-image");

const avatarUrl =
    user.user_metadata?.avatar_url;


if(avatarUrl){

    avatarImage.src =
        avatarUrl + "?t=" + Date.now();

}
else{

    avatarImage.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="90"
                 height="90"
                 viewBox="0 0 90 90">

                <circle
                    cx="45"
                    cy="45"
                    r="45"
                    fill="#EAFBF1"/>

                <text
                    x="45"
                    y="58"
                    text-anchor="middle"
                    font-size="42">
                    👤
                </text>

            </svg>
        `);

}
}



/* ================= SAVE PROFILE ================= */

async function saveProfile(){

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();


    const { data, error } =
        await supabaseClient.auth.updateUser({

            data:{

                profile_email: email,

                profile_phone: phone

            }

        });


    if(error){

        console.error(error);

        showMessage(
            "error",
            "❌ Không thể lưu thông tin."
        );

        return;
    }


    showMessage(
        "success",
        "✅ Đã lưu thông tin thành công."
    );

}


/* ================= CHANGE PASSWORD ================= */

/* ================= ĐỔI MẬT KHẨU ================= */

function changePassword(){

    document.getElementById("old-password").value = "";
    document.getElementById("new-password").value = "";
    document.getElementById("confirm-password").value = "";

    document.getElementById("password-error").style.display = "none";

    document.getElementById("password-popup").style.display = "flex";

}


/* ================= ĐÓNG POPUP ================= */

function closePasswordPopup(){

    document.getElementById("password-popup").style.display = "none";

}


/* ================= HIỆN / ẨN MẬT KHẨU ================= */

function togglePassword(id){

    const input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

    }
    else{

        input.type = "password";

    }

}


/* ================= BÁO LỖI ================= */

function showPasswordError(message){

    const error =
        document.getElementById("password-error");

    error.textContent = message;

    error.style.display = "block";

}


/* ================= KIỂM TRA & XÁC NHẬN ĐỔI MẬT KHẨU ================= */

/* ================= KIỂM TRA & XÁC NHẬN ĐỔI MẬT KHẨU ================= */

async function confirmChangePassword(){

    const oldPassword =
        document.getElementById("old-password").value;

    const newPassword =
        document.getElementById("new-password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;


    /* ================= KIỂM TRA MẬT KHẨU CŨ ================= */

    if(!oldPassword){

        showPasswordError(
            "⚠️ Vui lòng nhập mật khẩu hiện tại."
        );

        return;

    }


    /* ================= KIỂM TRA MẬT KHẨU MỚI ================= */

    if(!newPassword){

        showPasswordError(
            "⚠️ Vui lòng nhập mật khẩu mới."
        );

        return;

    }


    if(newPassword.length < 6){

        showPasswordError(
            "⚠️ Mật khẩu mới phải có ít nhất 6 ký tự."
        );

        return;

    }


    /* ================= SO SÁNH ================= */

    if(newPassword !== confirmPassword){

        showPasswordError(
            "❌ Mật khẩu mới và xác nhận mật khẩu không giống nhau."
        );

        return;

    }


    /* ================= KHÔNG TRÙNG MẬT KHẨU CŨ ================= */

    if(oldPassword === newPassword){

        showPasswordError(
            "⚠️ Mật khẩu mới phải khác mật khẩu hiện tại."
        );

        return;

    }


    try{

        /* ================= LẤY USER ================= */

        const {
            data:{
                user
            },
            error:userError
        } =
            await supabaseClient.auth.getUser();


        if(userError || !user){

            showPasswordError(
                "❌ Phiên đăng nhập đã hết."
            );

            return;

        }


        /* ================= LẤY USERNAME ================= */

        const username =
            user.user_metadata?.username;


        if(!username){

            showPasswordError(
                "❌ Không xác định được ID đăng nhập."
            );

            return;

        }


        /*
         * ConteGiacJP dùng email nội bộ
         *
         * username@contegiacjp.internal
         */

        const internalEmail =
            `${username}@contegiacjp.internal`;


        /* ================= KIỂM TRA MẬT KHẨU CŨ ================= */

        const {
            error:loginError
        } =
            await supabaseClient.auth.signInWithPassword({

                email:internalEmail,

                password:oldPassword

            });


        /* ================= MẬT KHẨU CŨ SAI ================= */

        if(loginError){

            showPasswordError(
                "❌ Mật khẩu hiện tại không đúng."
            );

            return;

        }


        /*
         * TỚI ĐÂY NGHĨA LÀ:
         *
         * Mật khẩu cũ đúng
         * Mật khẩu mới hợp lệ
         * Hai mật khẩu mới giống nhau
         *
         * → MỚI HIỆN POPUP XÁC NHẬN
         */

        document.getElementById(
            "password-confirm-popup"
        ).style.display = "flex";

    }
    catch(error){

        console.error(error);

        showPasswordError(
            "❌ " +
            (
                error.message ||
                "Không thể kiểm tra mật khẩu."
            )
        );

    }

}


/* ================= ĐÓNG POPUP XÁC NHẬN ================= */

function closePasswordConfirmPopup(){

    document.getElementById(
        "password-confirm-popup"
    ).style.display = "none";

}


/* ================= THỰC HIỆN ĐỔI MẬT KHẨU ================= */

async function executePasswordChange(){

    const newPassword =
        document.getElementById("new-password").value;


    try{

        const {
            error
        } =
            await supabaseClient.auth.updateUser({

                password:newPassword

            });


        if(error){

            console.error(error);

            closePasswordConfirmPopup();

            showPasswordError(
                "❌ " + error.message
            );

            return;

        }


        /* ================= ĐÓNG CẢ 2 POPUP ================= */

        closePasswordConfirmPopup();

        closePasswordPopup();


        /* ================= THÔNG BÁO ================= */

        showMessage(
            "success",
            "✅ Đổi mật khẩu thành công!"
        );

    }
    catch(error){

        console.error(error);

        closePasswordConfirmPopup();

        showPasswordError(
            "❌ " +
            (
                error.message ||
                "Không thể đổi mật khẩu."
            )
        );

    }

}


/* ================= MESSAGE ================= */

function showMessage(type,text){

    const message =
        document.getElementById("message");

    message.className =
        "message " + type;

    message.textContent =
        text;

    message.style.display =
        "block";


    /* TỰ ĐỘNG TẮT SAU 2 GIÂY */

    setTimeout(function(){

        message.style.display =
            "none";

    }, 2000);

}

async function changeAvatar(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }


    // Giới hạn 5MB
    if(file.size > 5 * 1024 * 1024){

        alert("Ảnh phải nhỏ hơn 5MB.");

        return;
    }


    // Chỉ nhận ảnh
    if(!file.type.startsWith("image/")){

        alert("Vui lòng chọn file hình ảnh.");

        return;
    }


    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if(userError || !user){

        alert("Phiên đăng nhập đã hết.");

        return;
    }


    /*
     * Mỗi user có 1 file avatar cố định.
     * Ví dụ:
     * user-id/avatar
     */
    const filePath =
        `${user.id}/avatar`;


    const { error: uploadError } =
        await supabaseClient.storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    upsert:true,
                    contentType:file.type,
                    cacheControl:"3600"
                }
            );


    if(uploadError){

        console.error(uploadError);

        alert(
            "Không thể tải ảnh lên.\n\n" +
            uploadError.message
        );

        return;
    }


    /*
     * Lấy URL ảnh
     */
    const {
        data: publicUrlData
    } =
        supabaseClient.storage
            .from("avatars")
            .getPublicUrl(filePath);


    const avatarUrl =
        publicUrlData.publicUrl;


    /*
     * Lưu URL ảnh vào user metadata
     */
    const { error: updateError } =
        await supabaseClient.auth.updateUser({

            data:{
                avatar_url: avatarUrl
            }

        });


    if(updateError){

        console.error(updateError);

        alert(
            "Ảnh đã tải lên nhưng chưa lưu được thông tin."
        );

        return;
    }


    /*
     * Hiện ảnh ngay lập tức
     */
    document.getElementById("avatar-image").src =
        avatarUrl + "?t=" + Date.now();


    showMessage(
    "success",
    "✅ Đã đổi ảnh đại diện!"
);
}
