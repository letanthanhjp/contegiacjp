<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Hồ sơ - ConteGiacJP</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>

body{
    margin:0;
    background:#F3F6FB;
    font-family:Arial;
    color:#333;
}


/* ================= HEADER ================= */

.header{
    width:1000px;
    margin:30px auto 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-title{
    color:#1E40AF;
    font-size:28px;
    font-weight:bold;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-btn{
    display:flex;
    align-items:center;
    gap:7px;
    color:#1E40AF;
    font-size:15px;
    font-weight:bold;
    padding:8px 5px;
    white-space:nowrap;
}


.profile-btn{
    background:#22C55E;
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.profile-btn:hover{
    background:#16A34A;
}


.logout-btn{
    background:#EF4444;
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.logout-btn:hover{
    background:#DC2626;
}

.back-btn{
    background:white;
    color:#1E40AF;
    border:2px solid #1E40AF;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.back-btn:hover{
    background:#1E40AF;
    color:white;
}


/* ================= PROFILE ================= */

.profile-box{
    width:700px;
    margin:30px auto;
    background:white;
    padding:45px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,.12);
}

.profile-box h1{
    text-align:center;
    color:#D97706;
    margin-top:0;
    margin-bottom:35px;
}

.avatar{
    width:90px;

    border-radius:50%;

    justify-content:center;

    font-size:42px;
}

.userid{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#1E40AF;
    margin-bottom:35px;
}


/* ================= FORM ================= */

.form-group{
    margin-bottom:25px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    font-size:16px;
}

.form-group input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #D5D5D5;
    border-radius:10px;
    font-size:16px;
}

.form-group input:focus{
    outline:none;
    border-color:#1E40AF;
}


/* ID không sửa được */

.readonly{
    background:#F3F4F6;
    color:#777;
    cursor:not-allowed;
}


/* ================= BUTTON ================= */

.save-btn{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#22C55E;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:hover{
    background:#16A34A;
}


.password-btn{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:2px solid #1E40AF;
    border-radius:10px;
    background:white;
    color:#1E40AF;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.password-btn:hover{
    background:#1E40AF;
    color:white;
}


/* ================= MESSAGE ================= */

.message{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#DCFCE7;
    color:#166534;
}

.error{
    background:#FEE2E2;
    color:#991B1B;
}


/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .header{
        width:90%;
    }

    .profile-box{
        width:80%;
    }

}

.avatar-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:20px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    background:#EAFBF1;
    border:4px solid #EAFBF1;
}

.avatar-edit{
    margin-top:10px;
    color:#1E40AF;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.avatar-edit:hover{
    text-decoration:underline;
}

.password-btn{
    width:100%;
    padding:14px;
    border:2px solid #1E40AF;
    border-radius:10px;
    background:white;
    color:#1E40AF;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.password-btn:hover{
    background:#1E40AF;
    color:white;
}


/* ================= LOGOUT POPUP ================= */

.logout-popup{
    display:none;
    position:fixed;
    z-index:9999;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    justify-content:center;
    align-items:center;
}

.logout-box{
    width:400px;
    background:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logout-icon{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:50%;

    color:#EF4444;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

.logout-box h2{

}

.logout-box p{

}

.logout-actions{

}

.logout-cancel,
.logout-confirm{

    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.logout-cancel{
    background:white;
    color:#1E40AF;
    border:2px solid #1E40AF;
}

.logout-cancel:hover{
    background:#EFF6FF;
}

.logout-confirm{
    background:#EF4444;
    color:white;
    border:none;
}

.logout-confirm:hover{
    background:#DC2626;
}

.label-note{
    color:#999;
    font-size:14px;
    font-weight:normal;
}

/* ================= CHANGE PASSWORD POPUP ================= */

.password-popup{

    display:none;

    position:fixed;

    z-index:99999;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.45);

    justify-content:center;
    align-items:center;

}


.password-box{

    width:500px;

    background:white;

    border-radius:20px;

    padding:35px;

    box-shadow:0 20px 60px rgba(0,0,0,.25);

}


.password-box h2{

    margin-top:0;

    margin-bottom:30px;

    text-align:center;

    color:#1E40AF;

    font-size:25px;

}


.password-group{

    margin-bottom:20px;

}


.password-group label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

    font-size:16px;

    color:#333;

}


.password-input{

    display:flex;

    align-items:center;

    gap:8px;

}


.password-input input{

    flex:1;

    width:100%;

    box-sizing:border-box;

    padding:15px;

    border:1px solid #D5D5D5;

    border-radius:10px;

    font-size:16px;

}


.password-input input:focus{

    outline:none;

    border-color:#1E40AF;

}


.password-input button{

    width:52px;

    height:50px;

    border:none;

    border-radius:10px;

    background:#EFEFEF;

    cursor:pointer;

}


.password-input button:hover{

}


.password-error{

    display:none;

    margin-top:5px;

    margin-bottom:15px;

    padding:12px;

    border-radius:10px;

    background:#FEE2E2;

    color:#991B1B;

    font-size:14px;

    text-align:center;

    font-weight:bold;

}


.password-actions{

    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:25px;

}


.password-cancel,
.password-confirm{

    padding:13px 28px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


.password-cancel{

    background:white;

    color:#1E40AF;

    border:2px solid #1E40AF;

}


.password-cancel:hover{

    background:#EFF6FF;

}


.password-confirm{

    background:#22C55E;

    color:white;

    border:none;

}


.password-confirm:hover{

    background:#16A34A;

}


@media(max-width:600px){

    .password-box{

        width:85%;

        padding:25px;

    }

}

</style>

<!-- ================= HEADER ================= -->

<!-- ================= HEADER ================= -->

<div id="site-header"></div>


<!-- ================= PROFILE ================= -->

<div class="profile-box">

    <h1>HỒ SƠ CỦA TÔI</h1>


   <div class="avatar-wrapper">

    <img

<!-- ================= CHANGE PASSWORD POPUP ================= -->

<div id="password-popup" class="password-popup">

    <div class="password-box">

        <h2>🔐 ĐỔI MẬT KHẨU</h2>


        <!-- MẬT KHẨU CŨ -->

        <div class="password-group">

            <label>Mật khẩu hiện tại</label>

            <div class="password-input">

                <input
                    type="password"
                    id="old-password"
                    placeholder="Nhập mật khẩu hiện tại"
                >

                <button
                    type="button"
                    onclick="togglePassword('old-password')"

                    👁
                </button>

            </div>

            <label>Mật khẩu mới</label>

                <input
                    type="password"
                    id="new-password"

                >

                    onclick="togglePassword('new-password')"

                    👁

<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://tnqvuclzzyxnzfszajjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_i9uqZBOYC2rhsdIimNGmeQ_oPXOrTnq";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ================= LOAD PROFILE ================= */

async function loadProfile(){

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if(!user){

        location.href = "index.html";

        return;

    }


    const username =
        user.user_metadata?.username || "";


    document.getElementById("display-username").textContent =
        username;

    document.getElementById("username").value =
        username;


    document.getElementById("email").value =
    user.user_metadata?.profile_email || "";

     document.getElementById("phone").value =
    user.user_metadata?.profile_phone || "";

    const avatarImage =
    document.getElementById("avatar-image");

const avatarUrl =
    user.user_metadata?.avatar_url;


if(avatarUrl){

    avatarImage.src =
        avatarUrl + "?t=" + Date.now();

}
else{

    avatarImage.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="90"
                 height="90"
                 viewBox="0 0 90 90">

                <circle
                    cx="45"
                    cy="45"
                    r="45"
                    fill="#EAFBF1"/>

                <text
                    x="45"
                    y="58"
                    text-anchor="middle"
                    font-size="42">
                    👤
                </text>

            </svg>
        `);

}
}



/* ================= SAVE PROFILE ================= */

async function saveProfile(){

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();


    const { data, error } =
        await supabaseClient.auth.updateUser({

            data:{

                profile_email: email,

                profile_phone: phone

            }

        });


    if(error){

        console.error(error);

        showMessage(
            "error",
            "❌ Không thể lưu thông tin."
        );

        return;
    }


    showMessage(
        "success",
        "✅ Đã lưu thông tin thành công."
    );

}


/* ================= CHANGE PASSWORD ================= */

/* ================= ĐỔI MẬT KHẨU ================= */

function changePassword(){

    document.getElementById("old-password").value = "";
    document.getElementById("new-password").value = "";
    document.getElementById("confirm-password").value = "";

    document.getElementById("password-error").style.display = "none";

    document.getElementById("password-popup").style.display = "flex";

}


/* ================= ĐÓNG POPUP ================= */

function closePasswordPopup(){

    document.getElementById("password-popup").style.display = "none";

}


/* ================= HIỆN / ẨN MẬT KHẨU ================= */

function togglePassword(id){

    const input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

    }
    else{

        input.type = "password";

    }

}


/* ================= BÁO LỖI ================= */

function showPasswordError(message){

    const error =
        document.getElementById("password-error");

    error.textContent = message;

    error.style.display = "block";

}


/* ================= XÁC NHẬN ĐỔI ================= */

async function confirmChangePassword(){

    const oldPassword =
        document.getElementById("old-password").value;

    const newPassword =
        document.getElementById("new-password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;


    /* KIỂM TRA MẬT KHẨU CŨ */

    if(!oldPassword){

        showPasswordError(
            "⚠️ Vui lòng nhập mật khẩu hiện tại."
        );

        return;

    }


    /* KIỂM TRA MẬT KHẨU MỚI */

    if(!newPassword){

        showPasswordError(
            "⚠️ Vui lòng nhập mật khẩu mới."
        );

        return;

    }


    if(newPassword.length < 6){

        showPasswordError(
            "⚠️ Mật khẩu mới phải có ít nhất 6 ký tự."
        );

        return;

    }


    /* SO SÁNH 2 MẬT KHẨU */

    if(newPassword !== confirmPassword){

        showPasswordError(
            "❌ Mật khẩu mới và xác nhận mật khẩu không giống nhau."
        );

        return;

    }


    /* KHÔNG CHO ĐẶT MẬT KHẨU MỚI GIỐNG CŨ */

    if(oldPassword === newPassword){

        showPasswordError(
            "⚠️ Mật khẩu mới phải khác mật khẩu hiện tại."
        );

        return;

    }


    /* XÁC NHẬN */

    const confirmed =
        confirm(
            "Bạn có chắc chắn muốn đổi mật khẩu không?"
        );


    if(!confirmed){

        return;

    }


    try{

        /* LẤY USER HIỆN TẠI */

        const {
            data:{
                user
            },
            error:userError
        } =
            await supabaseClient.auth.getUser();


        if(userError || !user){

            throw new Error(
                "Phiên đăng nhập đã hết."
            );

        }


        /* LẤY USERNAME */

        const username =
            user.user_metadata?.username;


        if(!username){

            throw new Error(
                "Không xác định được ID đăng nhập."
            );

        }


        /*
         * XÁC NHẬN MẬT KHẨU CŨ
         *
         * ConteGiacJP dùng email nội bộ
         * username@contegiacjp.internal
         */

        const internalEmail =
            `${username}@contegiacjp.internal`;


        const {
            error:loginError
        } =
            await supabaseClient.auth.signInWithPassword({

                email:internalEmail,

                password:oldPassword

            });


        if(loginError){

            showPasswordError(
                "❌ Mật khẩu hiện tại không đúng."
            );

            return;

        }


        /* ĐỔI MẬT KHẨU */

        const {
            error:updateError
        } =
            await supabaseClient.auth.updateUser({

                password:newPassword

            });


        if(updateError){

            throw updateError;

        }


        /* ĐÓNG POPUP */

        closePasswordPopup();


        /* THÔNG BÁO */

        showMessage(
            "success",
            "✅ Đổi mật khẩu thành công!"
        );

    }
    catch(error){

        console.error(error);

        showPasswordError(
            "❌ " + (
                error.message ||
                "Không thể đổi mật khẩu."
            )
        );

    }

}


/* ================= MESSAGE ================= */

function showMessage(type,text){

    const message =
        document.getElementById("message");


    message.className =
        "message " + type;


    message.textContent =
        text;


    message.style.display =
        "block";

}


/* ================= START ================= */

/* ================= HEADER ================= */

async function updateHeader(){

    const {
        data:{
            user
        }
    } = await supabaseClient.auth.getUser();

    if(!user){
        location.href = "index.html";
        return;
    }

    const username =
        user.user_metadata?.username || "User";

    document.getElementById("header-username").textContent =
        username;
}




updateHeader();
loadProfile();

async function changeAvatar(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }


    // Giới hạn 5MB
    if(file.size > 5 * 1024 * 1024){

        alert("Ảnh phải nhỏ hơn 5MB.");

        return;
    }


    // Chỉ nhận ảnh
    if(!file.type.startsWith("image/")){

        alert("Vui lòng chọn file hình ảnh.");

        return;
    }


    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if(userError || !user){

        alert("Phiên đăng nhập đã hết.");

        return;
    }


    /*
     * Mỗi user có 1 file avatar cố định.
     * Ví dụ:
     * user-id/avatar
     */
    const filePath =
        `${user.id}/avatar`;


    const { error: uploadError } =
        await supabaseClient.storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    upsert:true,
                    contentType:file.type,
                    cacheControl:"3600"
                }
            );


    if(uploadError){

        console.error(uploadError);

        alert(
            "Không thể tải ảnh lên.\n\n" +
            uploadError.message
        );

        return;
    }


    /*
     * Lấy URL ảnh
     */
    const {
        data: publicUrlData
    } =
        supabaseClient.storage
            .from("avatars")
            .getPublicUrl(filePath);


    const avatarUrl =
        publicUrlData.publicUrl;


    /*
     * Lưu URL ảnh vào user metadata
     */
    const { error: updateError } =
        await supabaseClient.auth.updateUser({

            data:{
                avatar_url: avatarUrl
            }

        });


    if(updateError){

        console.error(updateError);

        alert(
            "Ảnh đã tải lên nhưng chưa lưu được thông tin."
        );

        return;
    }


    /*
     * Hiện ảnh ngay lập tức
     */
    document.getElementById("avatar-image").src =
        avatarUrl + "?t=" + Date.now();


    alert("✅ Đã đổi ảnh đại diện!");
}

</script>
