<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>ConteGiacJP</title>

<style>

body{
    background:#F3F6FB;
    font-family:Arial;
    text-align:center;
}

.box{
    width:900px;
    margin:auto;
    margin-top:80px;
    background:white;
    padding:50px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,.15);
}

h1{
    color:#1E40AF;
    font-size:52px;
}

h2{
    color:#D97706;
}

p{
    font-size:22px;
    line-height:40px;
}

/* Menu trình độ */

.level-menu{
    margin:40px 0;
}

.level-menu button{
    background:#ffffff;
    color:#1E40AF;
    border:2px solid #1E40AF;
    border-radius:10px;
    padding:12px 22px;
    margin:6px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
}

.level-menu button:hover{
    background:#1E40AF;
    color:white;
}

</style>

</head>

<body>

<div class="box">

<h1>ConteGiacJP</h1>

<h2>
Chào mừng những người hạnh phúc và thành công
<br><br>
vì đã tìm thấy địa chỉ này.
</h2>

<!-- Menu -->

<div class="level-menu">
   
    <button>N5</button>
    <button>N4</button>
    <button>N3</button>
    <button>N2</button>
    <button>N1</button>
    <button>Kanji</button>
</div>

<p>
Đây là dự án học tiếng Nhật miễn phí.
</p>

<p>
Chúng ta sẽ cùng nhau chinh phục tiếng Nhật.<br><br>
hehe
</p>

</div>

</body>

</html>
